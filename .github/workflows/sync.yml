name: Sync cask from source repo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, publish, and verify
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch the latest cask from the source repository
        # The source repository is public, so reading its default branch
        # needs no cross-repository credential -- only this repo's own
        # default GITHUB_TOKEN, used below to commit and push here.
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
            -o Casks/amfaa.rb \
            https://raw.githubusercontent.com/virusimmortal00/AllMyFriendsAreAgents/main/homebrew/Casks/amfaa.rb
      - name: Lint the fetched cask before publishing it
        run: brew style Casks/amfaa.rb
      - name: Check whether it changed
        id: diff
        run: |
          if git diff --quiet -- Casks/amfaa.rb; then
            echo 'Cask already matches the source repository; nothing to sync.'
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/amfaa.rb
          git commit --message 'Sync cask from AllMyFriendsAreAgents'
          git push
      - name: Verify the published tap installs for real
        # Runs whether or not this run changed anything -- a periodic
        # end-to-end check, not only a post-sync one. A fully qualified
        # `brew install --cask user/repo/cask` taps and trusts only this one
        # item automatically; unlike a bare `brew tap`, it needs no separate
        # `brew trust` step (see the tap's own README for why that matters).
        run: |
          brew install --cask virusimmortal00/amfaa/amfaa
          identity=$("$(brew --prefix)/bin/amfaa" version)
          echo "$identity"
          expected=$(ruby -e 'puts /version "([^"]+)"/.match(File.read("Casks/amfaa.rb"))[1]')
          echo "$identity" | grep -q "\"version\":\"$expected\"" || {
            echo "::error::Installed amfaa reported a different version than the published cask declares ($expected)." >&2
            exit 1
          }
