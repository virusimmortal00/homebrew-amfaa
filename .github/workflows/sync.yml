name: Sync cask from source repo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, validate, and publish
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch the latest cask from the source repository
        # The source repository is public, so reading its default branch
        # needs no cross-repository credential -- only this repo's own
        # default GITHUB_TOKEN, used below to commit and push here.
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 4 --retry-all-errors \
            -o /tmp/amfaa.rb \
            https://raw.githubusercontent.com/virusimmortal00/AllMyFriendsAreAgents/main/homebrew/Casks/amfaa.rb
      - name: Check whether it changed
        id: diff
        run: |
          if diff -q /tmp/amfaa.rb Casks/amfaa.rb > /dev/null 2>&1; then
            echo 'Cask already matches the source repository; nothing to sync.'
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the new cask under its real tap name before publishing it
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp /tmp/amfaa.rb Casks/amfaa.rb
          brew tap virusimmortal00/amfaa "$PWD"
          brew style virusimmortal00/amfaa/amfaa
          brew audit --cask virusimmortal00/amfaa/amfaa
          brew install --cask virusimmortal00/amfaa/amfaa
          "$(brew --prefix)/bin/amfaa" version
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/amfaa.rb
          git commit --message 'Sync cask from AllMyFriendsAreAgents'
          git push
